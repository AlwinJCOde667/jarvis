<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#06222e"/><stop offset="100%" stop-color="#02060b"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#9ff3ff"/><stop offset="100%" stop-color="#00b7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#0ab6e6" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="900" height="340" fill="url(#bg)"/>
  <rect width="900" height="340" fill="url(#grid)"/>

  <!-- scan line -->
  <rect x="0" y="0" width="900" height="2" fill="#4df0ff" opacity=".35">
    <animate attributeName="y" from="0" to="340" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- arc reactor -->
  <g transform="translate(450 170)" filter="url(#glow)" fill="none" stroke="#4df0ff">
    <circle r="120" stroke-opacity=".25" stroke-width="1"/>
    <g>
      <circle r="108" stroke-width="3" stroke-dasharray="4 10" stroke-opacity=".8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="88" stroke-width="6" stroke-dasharray="60 20 10 20" stroke-opacity=".9"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="66" stroke-width="2" stroke-dasharray="2 6"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>
    <g stroke-width="5" stroke-opacity=".85">
      <path d="M0-52 L14-30 L-14-30 Z"/><path d="M0-52 L14-30 L-14-30 Z" transform="rotate(60)"/>
      <path d="M0-52 L14-30 L-14-30 Z" transform="rotate(120)"/><path d="M0-52 L14-30 L-14-30 Z" transform="rotate(180)"/>
      <path d="M0-52 L14-30 L-14-30 Z" transform="rotate(240)"/><path d="M0-52 L14-30 L-14-30 Z" transform="rotate(300)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
    </g>
    <circle r="30" fill="url(#core)" stroke="none">
      <animate attributeName="r" values="26;34;26" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HUD text -->
  <g font-family="Consolas, 'Courier New', monospace" fill="#4df0ff" font-size="13" filter="url(#glow)">
    <text x="30" y="40" font-size="16" letter-spacing="3">J.A.R.V.I.S</text>
    <text x="30" y="62" opacity=".7">SYS.STATUS ..... ONLINE</text>
    <text x="30" y="82" opacity=".7">TELEGRAM ....... LINKED</text>
    <text x="30" y="102" opacity=".7">GMAIL WATCH .... ARMED</text>
    <text x="30" y="122" opacity=".7">VOICE CORE ..... READY</text>
    <text x="620" y="40" font-size="16" letter-spacing="3">GOOD EVENING, SIR.</text>
    <text x="620" y="62" opacity=".7">POLL INTERVAL .. 60s</text>
    <text x="620" y="82" opacity=".7">GMAIL SCOPE .... READ-ONLY</text>
    <text x="620" y="102" opacity=".7">LLM ............ GEMINI</text>
    <text x="450" y="322" text-anchor="middle" font-size="15" letter-spacing="6">
      AT YOUR SERVICE
      <animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- waveform -->
  <g stroke="#4df0ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" transform="translate(40 250)">
    <line x1="0"  y1="0" x2="0"  y2="0"><animate attributeName="y1" values="-6;-30;-6" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y2" values="6;30;6" dur="1.1s" repeatCount="indefinite"/></line>
    <line x1="14" y1="0" x2="14" y2="0"><animate attributeName="y1" values="-20;-8;-20" dur=".9s" repeatCount="indefinite"/><animate attributeName="y2" values="20;8;20" dur=".9s" repeatCount="indefinite"/></line>
    <line x1="28" y1="0" x2="28" y2="0"><animate attributeName="y1" values="-10;-34;-10" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y2" values="10;34;10" dur="1.3s" repeatCount="indefinite"/></line>
    <line x1="42" y1="0" x2="42" y2="0"><animate attributeName="y1" values="-26;-6;-26" dur="1s" repeatCount="indefinite"/><animate attributeName="y2" values="26;6;26" dur="1s" repeatCount="indefinite"/></line>
    <line x1="56" y1="0" x2="56" y2="0"><animate attributeName="y1" values="-8;-24;-8" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="8;24;8" dur="1.2s" repeatCount="indefinite"/></line>
  </g>
  <g stroke="#4df0ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" transform="translate(790 250)">
    <line x1="0"  y1="0" x2="0"  y2="0"><animate attributeName="y1" values="-22;-6;-22" dur="1s" repeatCount="indefinite"/><animate attributeName="y2" values="22;6;22" dur="1s" repeatCount="indefinite"/></line>
    <line x1="14" y1="0" x2="14" y2="0"><animate attributeName="y1" values="-8;-32;-8" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y2" values="8;32;8" dur="1.25s" repeatCount="indefinite"/></line>
    <line x1="28" y1="0" x2="28" y2="0"><animate attributeName="y1" values="-24;-10;-24" dur=".95s" repeatCount="indefinite"/><animate attributeName="y2" values="24;10;24" dur=".95s" repeatCount="indefinite"/></line>
    <line x1="42" y1="0" x2="42" y2="0"><animate attributeName="y1" values="-6;-28;-6" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y2" values="6;28;6" dur="1.15s" repeatCount="indefinite"/></line>
    <line x1="56" y1="0" x2="56" y2="0"><animate attributeName="y1" values="-18;-6;-18" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y2" values="18;6;18" dur="1.05s" repeatCount="indefinite"/></line>
  </g>
</svg>
